name: diag-zmq-segv

on:
  push:
    branches: [diag/zmq-segv]

jobs:
  segv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - name: environment
        run: |
          uname -a; rustc -V; gcc --version | head -1; ldd --version | head -1
          lscpu | grep -E 'Model name|Vendor|^CPU\(s\)'
          grep -m1 -o -w -E 'user_shstk|shstk|ibt|avx512f|lam' /proc/cpuinfo | sort -u
          ulimit -a
      - run: cargo test -p bsrs --features zmq --test zmq_round_trip --no-run
      - name: plain run
        run: |
          bin=$(find target/debug/deps -name 'zmq_round_trip-*' -type f -executable | head -1)
          echo "bin=$bin"
          $bin --test-threads=1 || echo "exit=$?"
      - name: gdb backtrace
        run: |
          bin=$(find target/debug/deps -name 'zmq_round_trip-*' -type f -executable | head -1)
          gdb -batch -ex 'set pagination off' -ex run -ex 'info registers rip rsp' \
            -ex 'x/6i $pc' -ex 'thread apply all bt' --args $bin --test-threads=1 2>&1 | tail -200
